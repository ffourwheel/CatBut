<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f3dcc1" />
    <title>CatKub — กดปุ่มให้ครบ ระวังแมว!</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Trebuchet MS", "Noto Sans Thai", sans-serif;
        background: #f3dcc1;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body,
      #game-container {
        width: 100%;
        height: 100%;
        min-height: 100%;
        margin: 0;
        overflow: hidden;
        background: #f3dcc1;
      }

      body {
        overscroll-behavior: none;
        touch-action: none;
      }

      canvas {
        display: block;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <main id="game-container" aria-label="CatKub game"></main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
